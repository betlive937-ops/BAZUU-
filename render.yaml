services:
  - type: web
    name: bazuu
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BAZUU_ADMIN_USER
        sync: false
      - key: BAZUU_ADMIN_PASSWORD
        sync: false
      - key: BASE_URL
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: bazuu-data
      mountPath: /var/data
      sizeGB: 1
